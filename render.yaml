services:
  - type: web
    name: mlh-post
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_URL
        value: https://ai-gateway.vercel.sh/v1
      - key: MUSE_MODEL
        value: bytedance/seedream-5.0-pro
      - key: INTERNAL_PROMPT
        sync: false
